worker_processes  1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;  # Docker embedded DNS — нужен lua cosocket-клиентам (discovery/token запросы)

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;;";
    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;;";

    lua_shared_dict discovery 1m;   # кэш .well-known/openid-configuration
    lua_shared_dict jwks 1m;        # кэш JWKS ключей
    lua_shared_dict sessions 5m;    # backend для lua-resty-session (session store в памяти воркера)

    server {
        listen 80;
        server_name _;

        location / {
            access_by_lua_block {
                local opts = {
                    redirect_uri         = "/redirect_uri",
                    discovery             = "http://keycloak:8080/realms/corp-sso/.well-known/openid-configuration",
                    client_id             = "nginx-openresty-client",
                    client_secret         = "nginx-openresty-secret-CHANGEME",
                    scope                 = "openid email profile",
                    session_contents      = { id_token = true, access_token = true },
                    -- redirect_uri оставлен относительным: lua-resty-openidc сам достраивает
                    -- его до абсолютного из заголовков запроса (X-Forwarded-Proto/Host либо
                    -- scheme/Host), что переносимо между localhost:4185 и реальным доменом
                    -- без правки конфига per-environment.
                    ssl_verify            = "no",
                }

                local res, err = require("resty.openidc").authenticate(opts)

                if err then
                    ngx.status = 500
                    ngx.say("OIDC auth error: ", err)
                    return ngx.exit(500)
                end

                if res and res.id_token then
                    ngx.req.set_header("X-Forwarded-User", res.id_token.preferred_username)
                    ngx.req.set_header("X-Forwarded-Email", res.id_token.email)
                end
            }

            proxy_pass http://nginx-hello:80;
            proxy_set_header Host $host;
        }
    }
}
