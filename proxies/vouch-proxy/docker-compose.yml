# vouch-proxy + front-nginx (auth_request) перед nginx-hello.
# vouch-proxy сам не проксирует приложение — только валидирует сессию (/validate)
# и ведёт OIDC handshake (/login, /auth), а nginx решает пускать ли запрос дальше.
#
# Запуск (после базового docker compose up -d в корне проекта):
#   docker compose -f proxies/vouch-proxy/docker-compose.yml up -d
#
# Проверка: http://localhost:4182/ -> редирект на Keycloak login ->
#   testuser / Test12345! -> редирект обратно, виден Hello World.

networks:
  oauth-net:
    external: true
    name: oauth-net

services:
  vouch-proxy:
    image: quay.io/vouch/vouch-proxy:0.48.0
    container_name: vouch-proxy
    volumes:
      - ./config.yml:/config/config.yml:ro
    networks:
      - oauth-net
    restart: unless-stopped

  nginx-vouch-front:
    image: nginx:1.27-alpine
    container_name: nginx-vouch-front
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4182:80"
    networks:
      - oauth-net
    depends_on:
      - vouch-proxy
    restart: unless-stopped
