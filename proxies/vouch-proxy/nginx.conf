# Классический auth_request-паттерн: nginx делает internal subrequest
# к vouch-proxy /validate; 200 -> пускаем на upstream, 401 -> редирект на /login.
server {
    listen 80;
    server_name _;

    location = /validate {
        internal;
        proxy_pass http://vouch-proxy:9090/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # /auth и /login обслуживаются напрямую vouch-proxy (OIDC callback, старт логина).
    location /auth {
        proxy_pass http://vouch-proxy:9090/auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://vouch-proxy:9090/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;
        auth_request_set $auth_resp_x_vouch_idp_claims_email $upstream_http_x_vouch_idp_claims_email;

        error_page 401 = @error401;

        proxy_pass http://nginx-hello:80;
        proxy_set_header X-Forwarded-User $auth_resp_x_vouch_user;
        proxy_set_header X-Forwarded-Email $auth_resp_x_vouch_idp_claims_email;
    }

    location @error401 {
        return 302 http://localhost:4182/login?url=http://localhost:4182$request_uri;
    }
}
