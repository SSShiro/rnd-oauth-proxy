global
    # require("haproxy-lua-http") в auth-request.lua ищет модуль по package.path,
    # без этой строки поиск идёт от cwd процесса, а не от каталога скрипта.
    lua-prepend-path /usr/local/etc/haproxy/?.lua
    lua-load /usr/local/etc/haproxy/auth-request.lua
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe_main
    bind *:80

    # /oauth2/* (start, callback, sign_out) должны идти напрямую в oauth2-proxy,
    # БЕЗ auth-проверки — иначе получим бесконечный редирект-луп.
    # ВАЖНО: use_backend в HAProxy не "прерывает" остальные http-request правила
    # этого frontend'а (они выполняются в порядке объявления независимо от
    # use_backend), поэтому каждое auth-related правило ниже явно исключает
    # is_oauth2_path через "unless" / "!is_oauth2_path".
    acl is_oauth2_path path_beg /oauth2/

    # Auth-subrequest: HAProxy дергает GET /oauth2/auth у oauth2-proxy-haproxy
    # и по коду ответа (2xx -> true) решает, пускать ли запрос дальше.
    http-request lua.auth-request auth_request_backend /oauth2/auth unless is_oauth2_path

    # Прокидываем identity-заголовки, которые oauth2-proxy вернул в ответе
    # на /oauth2/auth (X-Auth-Request-User/Email), дальше в апстрим.
    # Примечание: haproxy-lua-http нормализует имена заголовков ответа к
    # нижнему регистру перед тем, как auth-request.lua кладёт их в переменные,
    # поэтому имя переменной здесь в нижнем регистре, а не как в HTTP-заголовке.
    http-request set-header X-Auth-Request-User  %[var(req.auth_response_header.x_auth_request_user)]  if { var(txn.auth_response_successful) -m bool } !is_oauth2_path
    http-request set-header X-Auth-Request-Email %[var(req.auth_response_header.x_auth_request_email)] if { var(txn.auth_response_successful) -m bool } !is_oauth2_path

    # Неуспех аутентификации -> редирект на страницу логина oauth2-proxy.
    # Для прод-варианта имеет смысл добавить rd=<исходный URL>, чтобы вернуть
    # пользователя туда, откуда он пришёл.
    http-request redirect location http://localhost:4186/oauth2/start if !{ var(txn.auth_response_successful) -m bool } !is_oauth2_path

    use_backend be_oauth2_proxy if is_oauth2_path
    default_backend be_nginx_hello

backend auth_request_backend
    mode http
    server oauth2-proxy oauth2-proxy-haproxy:4180

backend be_oauth2_proxy
    mode http
    server oauth2-proxy oauth2-proxy-haproxy:4180

backend be_nginx_hello
    mode http
    server nginx-hello nginx-hello:80
