worker_processes  1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;  # Docker embedded DNS — нужен lua cosocket-клиентам (discovery/token запросы)

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;;";
    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;;";

    lua_shared_dict discovery 1m;   # кэш .well-known/openid-configuration
    lua_shared_dict jwks 1m;        # кэш JWKS ключей
    lua_shared_dict sessions 5m;    # backend для lua-resty-session (session store в памяти воркера)

    # RBAC прямо кодом: единая функция проверки роли в id_token.roles (массив строк),
    # переиспользуется в обоих location — это и есть главное отличие от декларативных
    # решений (gogatekeeper/Pomerium): гибкость ценой того, что любая логика — это Lua-код,
    # который надо тестировать самому, а не декларативный список, который валидирует сама программа.
    init_by_lua_block {
        function has_role(id_token, role)
            if not id_token or not id_token.roles then
                return false
            end
            for _, r in ipairs(id_token.roles) do
                if r == role then
                    return true
                end
            end
            return false
        end
    }

    server {
        listen 80;
        server_name _;

        # Более специфичный префикс "/admin" — nginx сам выбирает самый длинный
        # совпадающий префикс среди location без regex, порядок объявления в
        # файле не важен (проверено эмпирически: /admin обрабатывается этим
        # блоком, а не общим "/", независимо от того, что он объявлен ниже).
        location /admin {
            access_by_lua_block {
                local opts = {
                    redirect_uri      = "/redirect_uri",
                    discovery         = "http://keycloak:8080/realms/corp-sso/.well-known/openid-configuration",
                    client_id         = "nginx-openresty-rbac-client",
                    client_secret     = "nginx-openresty-rbac-secret-CHANGEME",
                    scope             = "openid email profile",
                    session_contents  = { id_token = true },
                    ssl_verify        = "no",
                }

                local res, err = require("resty.openidc").authenticate(opts)
                if err then
                    ngx.status = 500
                    ngx.say("OIDC auth error: ", err)
                    return ngx.exit(500)
                end

                ngx.log(ngx.ERR, "RBAC /admin: id_token.roles = ", require("cjson").encode(res.id_token and res.id_token.roles or {}))

                if not has_role(res.id_token, "Team2_Admins") then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                    ngx.say("Forbidden: требуется роль Team2_Admins")
                    return ngx.exit(403)
                end

                if res.id_token then
                    ngx.req.set_header("X-Forwarded-User", res.id_token.preferred_username)
                    ngx.req.set_header("X-Forwarded-Email", res.id_token.email)
                end
            }

            proxy_pass http://service2-backend:80;
            proxy_set_header Host $host;
        }

        location / {
            access_by_lua_block {
                local opts = {
                    redirect_uri      = "/redirect_uri",
                    discovery         = "http://keycloak:8080/realms/corp-sso/.well-known/openid-configuration",
                    client_id         = "nginx-openresty-rbac-client",
                    client_secret     = "nginx-openresty-rbac-secret-CHANGEME",
                    scope             = "openid email profile",
                    session_contents  = { id_token = true },
                    ssl_verify        = "no",
                }

                local res, err = require("resty.openidc").authenticate(opts)
                if err then
                    ngx.status = 500
                    ngx.say("OIDC auth error: ", err)
                    return ngx.exit(500)
                end

                ngx.log(ngx.ERR, "RBAC /: id_token.roles = ", require("cjson").encode(res.id_token and res.id_token.roles or {}))

                if not has_role(res.id_token, "Team2_Users") then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                    ngx.say("Forbidden: требуется роль Team2_Users")
                    return ngx.exit(403)
                end

                if res.id_token then
                    ngx.req.set_header("X-Forwarded-User", res.id_token.preferred_username)
                    ngx.req.set_header("X-Forwarded-Email", res.id_token.email)
                end
            }

            proxy_pass http://service2-backend:80;
            proxy_set_header Host $host;
        }
    }
}
