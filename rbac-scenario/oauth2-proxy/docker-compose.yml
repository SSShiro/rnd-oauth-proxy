# RBAC-сценарий для oauth2-proxy: path-based ролевой доступ на ОДНОМ домене
# service2.localhost:5184 через ДВА инстанса oauth2-proxy (нет native
# per-path RBAC в одном инстансе) + фронтовой nginx-роутер.
#
# Запуск (после базового стенда и rbac-scenario/docker-compose.yml):
#   docker compose -f rbac-scenario/oauth2-proxy/docker-compose.yml up -d
#
# Проверка:
#   http://service2.localhost:5184/       -> нужна роль Team2_Users
#   http://service2.localhost:5184/admin  -> нужна роль Team2_Admins

name: rbac-oauth2-proxy

networks:
  oauth-net:
    external: true
    name: oauth-net

services:
  oauth2-proxy-rbac-users:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: oauth2-proxy-rbac-users
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --oidc-issuer-url=http://keycloak:8080/realms/corp-sso
      - --client-id=oauth2-proxy-rbac-users-client
      - --client-secret=oauth2-proxy-rbac-users-secret-CHANGEME
      - --redirect-url=http://service2.localhost:5184/oauth2-users/callback
      - --proxy-prefix=/oauth2-users
      - --upstream=http://service2-backend:80
      - --oidc-groups-claim=roles
      - --scope=openid email profile
      - --allowed-group=Team2_Users
      - --email-domain=*
      - --cookie-name=_oauth2_rbac_users
      - --cookie-secret=SUcqXNbN3du-a9deuoAg542XP2LFjL1FHzztdoF6FzA=
      - --cookie-secure=false
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --insecure-oidc-allow-unverified-email=true
      - --silence-ping-logging=true
    networks:
      - oauth-net
    restart: unless-stopped

  oauth2-proxy-rbac-admins:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: oauth2-proxy-rbac-admins
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --oidc-issuer-url=http://keycloak:8080/realms/corp-sso
      - --client-id=oauth2-proxy-rbac-admins-client
      - --client-secret=oauth2-proxy-rbac-admins-secret-CHANGEME
      - --redirect-url=http://service2.localhost:5184/oauth2-admins/callback
      - --proxy-prefix=/oauth2-admins
      - --upstream=http://service2-backend:80
      - --oidc-groups-claim=roles
      - --scope=openid email profile
      - --allowed-group=Team2_Admins
      - --email-domain=*
      - --cookie-name=_oauth2_rbac_admins
      - --cookie-secret=yZQgbQHVYVInHSt57LaVRsDDTNrmQhL8YDRJoJuAehs=
      - --cookie-secure=false
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --insecure-oidc-allow-unverified-email=true
      - --silence-ping-logging=true
    networks:
      - oauth-net
    restart: unless-stopped

  nginx-oauth2-rbac-front:
    image: nginx:1.27-alpine
    container_name: nginx-oauth2-rbac-front
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5184:80"
    networks:
      - oauth-net
    depends_on:
      - oauth2-proxy-rbac-users
      - oauth2-proxy-rbac-admins
    restart: unless-stopped
