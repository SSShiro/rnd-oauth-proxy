# Фронтовой роутер: направляет запрос к нужному инстансу oauth2-proxy
# в зависимости от пути. /admin -> инстанс с --allowed-group=Team2_Admins,
# всё остальное -> инстанс с --allowed-group=Team2_Users. Каждый инстанс
# сам является полноценным reverse-proxy к service2-backend (не auth-only),
# поэтому после успешной проверки роли он же и проксирует дальше на backend.
server {
    listen 80;
    server_name _;

    # Callback-пути каждого инстанса (--proxy-prefix) должны идти НАПРЯМУЮ
    # в "свой" инстанс, иначе OIDC-обмен кода на токен не завершится.
    location /oauth2-users/ {
        proxy_pass http://oauth2-proxy-rbac-users:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2-admins/ {
        proxy_pass http://oauth2-proxy-rbac-admins:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://oauth2-proxy-rbac-admins:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://oauth2-proxy-rbac-users:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
