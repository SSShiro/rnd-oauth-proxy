global
    lua-prepend-path /usr/local/etc/haproxy/?.lua
    lua-load /usr/local/etc/haproxy/auth-request.lua
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe_main
    bind *:80

    # /oauth2/* (start, callback, sign_out) — напрямую в oauth2-proxy,
    # БЕЗ auth-проверки и БЕЗ ролевых правил (иначе redirect-loop).
    acl is_oauth2_path path_beg /oauth2/
    acl is_admin_path path_beg /admin

    # Auth-subrequest: только АУТЕНТИФИКАЦИЯ (в отличие от основного стенда,
    # этот oauth2-proxy запущен БЕЗ --allowed-group — пускает любого валидного
    # пользователя Keycloak; ролевое решение — ниже, целиком на HAProxy).
    http-request lua.auth-request auth_request_backend /oauth2/auth unless is_oauth2_path

    # Заголовок с ролями, который оauth2-proxy вернул в ответе на /oauth2/auth
    # (--oidc-groups-claim=roles + --set-xauthrequest=true -> X-Auth-Request-Groups).
    # haproxy-lua-http нормализует имена заголовков ответа к нижнему регистру.
    http-request set-header X-Auth-Request-User   %[var(req.auth_response_header.x_auth_request_user)]   if { var(txn.auth_response_successful) -m bool } !is_oauth2_path
    http-request set-header X-Auth-Request-Email  %[var(req.auth_response_header.x_auth_request_email)]  if { var(txn.auth_response_successful) -m bool } !is_oauth2_path
    http-request set-header X-Auth-Request-Groups %[var(req.auth_response_header.x_auth_request_groups)] if { var(txn.auth_response_successful) -m bool } !is_oauth2_path

    # Ролевые ACL: ищем подстроку роли в значении заголовка Groups
    # (значение — сериализованный список ролей, формат подтверждён тестом).
    acl has_admin_role var(req.auth_response_header.x_auth_request_groups) -m sub Team2_Admins
    acl has_user_role  var(req.auth_response_header.x_auth_request_groups) -m sub Team2_Users

    # Неуспех аутентификации -> на логин.
    http-request redirect location http://service2.localhost:5189/oauth2/start?rd=%[path] if !{ var(txn.auth_response_successful) -m bool } !is_oauth2_path

    # Успешная аутентификация, но не хватает роли для конкретного пути -> 403.
    http-request deny status 403 if { var(txn.auth_response_successful) -m bool } is_admin_path !has_admin_role !is_oauth2_path
    http-request deny status 403 if { var(txn.auth_response_successful) -m bool } !is_admin_path !has_user_role !is_oauth2_path

    use_backend be_oauth2_proxy if is_oauth2_path
    default_backend be_service2_backend

backend auth_request_backend
    mode http
    server oauth2-proxy oauth2-proxy-rbac-haproxy:4180

backend be_oauth2_proxy
    mode http
    server oauth2-proxy oauth2-proxy-rbac-haproxy:4180

backend be_service2_backend
    mode http
    server service2-backend service2-backend:80
