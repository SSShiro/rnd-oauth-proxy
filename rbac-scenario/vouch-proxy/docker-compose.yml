# RBAC-сценарий vouch-proxy: один инстанс vouch-proxy (только аутентификация
# + прокидывание claim "roles") + front-nginx (сам решает, пускать ли на
# "/" и "/admin", читая заголовок с ролями). Порт 5185.
#
# Запуск (после base stand + rbac-scenario/docker-compose.yml):
#   docker compose -f rbac-scenario/vouch-proxy/docker-compose.yml up -d

name: rbac-vouch-proxy

networks:
  oauth-net:
    external: true
    name: oauth-net

services:
  vouch-proxy-rbac:
    image: quay.io/vouch/vouch-proxy:0.48.0
    container_name: vouch-proxy-rbac
    volumes:
      - ./config.yml:/config/config.yml:ro
    networks:
      - oauth-net
    restart: unless-stopped

  nginx-vouch-rbac-front:
    # OpenResty вместо ванильного nginx — нужен только для одного маленького
    # access_by_lua_block, который проверяет роль ПОСЛЕ auth_request (см.
    # комментарий в nginx.conf, почему "if" здесь не работает). opm/luarocks
    # (fat-образ) не нужны — используется только встроенный ngx_http_lua_module.
    image: openresty/openresty:1.25.3.1-alpine
    container_name: nginx-vouch-rbac-front
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5185:80"
    networks:
      - oauth-net
    depends_on:
      - vouch-proxy-rbac
    restart: unless-stopped
