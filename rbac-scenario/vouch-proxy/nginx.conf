# RBAC на уровне путей реализован ЗДЕСЬ (front перед vouch-proxy), а не
# в самом vouch-proxy — у него нет policy-движка, только аутентификация
# (allowAllUsers) и прокидывание claim "roles" в заголовке ответа /validate.
#
# ВАЖНАЯ НАХОДКА: на ВАНИЛЬНОМ nginx эту проверку роли корректно не выразить.
# Директива "if" выполняется в фазе REWRITE, которая идёт РАНЬШЕ фазы ACCESS,
# где работает "auth_request" — то есть "if ($roles !~ ...)" после
# "auth_request_set $roles ..." читает $roles ДО того, как auth_request её
# заполнил (переменная ещё пуста), и запрос получает 403 даже без сессии
# вообще — это подтверждено эмпирически при разработке сценария. Обойти
# через "chain" из двух auth_request в одном location тоже нельзя — nginx
# явно запрещает больше одного auth_request на location ("auth_request
# directive is duplicate"). Рабочее решение без переписывания архитектуры —
# использовать OpenResty и один маленький access_by_lua_block ПОСЛЕ
# auth_request: Lua-код в access_by_lua_block выполняется корректно в
# access-фазе (уже после auth_request), поэтому видит правильное значение
# $roles. Это единственное протестированное рабочее решение — см. README.
server {
    listen 80;
    server_name _;

    location = /validate {
        internal;
        proxy_pass http://vouch-proxy-rbac:9090/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /auth {
        proxy_pass http://vouch-proxy-rbac:9090/auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://vouch-proxy-rbac:9090/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        auth_request /validate;
        auth_request_set $roles $upstream_http_x_vouch_idp_claims_roles;
        error_page 401 = @error401;

        access_by_lua_block {
            local roles = ngx.var.roles or ""
            if not string.find(roles, "Team2_Admins", 1, true) then
                ngx.status = 403
                ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                ngx.say("Forbidden: требуется роль Team2_Admins")
                return ngx.exit(403)
            end
        }

        proxy_pass http://service2-backend:80;
        proxy_set_header Host $host;
    }

    location / {
        auth_request /validate;
        auth_request_set $roles $upstream_http_x_vouch_idp_claims_roles;
        error_page 401 = @error401;

        access_by_lua_block {
            local roles = ngx.var.roles or ""
            if not string.find(roles, "Team2_Users", 1, true) then
                ngx.status = 403
                ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                ngx.say("Forbidden: требуется роль Team2_Users")
                return ngx.exit(403)
            end
        }

        proxy_pass http://service2-backend:80;
        proxy_set_header Host $host;
    }

    location @error401 {
        return 302 http://service2.localhost:5185/login?url=http://service2.localhost:5185$request_uri;
    }
}
