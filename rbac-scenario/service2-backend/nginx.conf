# Общий backend для RBAC-сценария (service2 + service2/admin), переиспользуется
# всеми 9 реализациями в rbac-scenario/<proxy>/. Сам backend НЕ содержит
# никакой авторизационной логики — она целиком на стороне конкретного
# proxy/балансировщика перед ним. Раздаёт разный контент для "/" и "/admin",
# чтобы можно было наглядно проверить, докуда именно пропустил прокси.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Эхо всех identity/claims-заголовков, которые проставляют разные
    # решения в этом RND (имена разные у каждого прокси) — чтобы одним
    # curl-запросом видеть, что реально долетело до backend.
    add_header X-Debug-Forwarded-User $http_x_forwarded_user always;
    add_header X-Debug-Forwarded-Email $http_x_forwarded_email always;
    add_header X-Debug-Auth-Request-User $http_x_auth_request_user always;
    add_header X-Debug-Auth-Request-Groups $http_x_auth_request_groups always;
    add_header X-Debug-Pomerium-Claim-Email $http_x_pomerium_claim_email always;
    add_header X-Debug-Userinfo $http_x_userinfo always;
    add_header X-Debug-Vouch-User $http_x_vouch_user always;
    add_header X-Debug-Vouch-Roles $http_x_vouch_idp_claims_roles always;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Явный exact-match на "/admin" БЕЗ конечного слэша — отдаём файл
    # напрямую через alias, чтобы избежать штатного поведения nginx
    # (ngx_http_index_module отдаёт 301 на "/admin/", когда URI совпадает
    # с директорией без конечного слэша). Это принципиально для RBAC-теста:
    # 301-редирект от backend'а как минимум лишний хоп, а при неправильно
    # проброшенном Host-заголовке на промежуточном прокси ещё и светит
    # внутренний Docker-hostname в Location внешнему клиенту.
    location = /admin {
        alias /usr/share/nginx/html/admin/index.html;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
