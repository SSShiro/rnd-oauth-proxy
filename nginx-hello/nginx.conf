server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Отдаём заголовки, которые проставляют oauth-proxy решения,
    # чтобы наглядно видеть, что аутентификация действительно прошла
    # и данные пользователя дошли до backend-приложения.
    location / {
        add_header X-Debug-Remote-User $http_x_forwarded_user always;
        add_header X-Debug-Remote-Email $http_x_forwarded_email always;
        add_header X-Debug-Auth-Request-User $http_x_auth_request_user always;
        try_files $uri $uri/ =404;
    }

    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
